name: Check stock

# Runs the stock checker on a schedule and commits any change to
# data/status.json back to the repo. GitHub Pages then serves the updated
# file on its next deploy. The page itself is static and needs no build step.
#
# Schedule note: GitHub Actions cron can drift by a few minutes and pauses
# after 60 days of repo inactivity. Make a commit (or push a dispatch) before
# then to keep it alive, or change the cron below.

on:
  schedule:
    # Every 3 hours at :00 UTC. Edit to "0 * * * *" for hourly or
    # "0 0 * * *" for daily. Times are UTC.
    - cron: "0 */3 * * *"
  workflow_dispatch: {}   # manual "Run workflow" button in the Actions tab

# Allow the bot to commit back to the repo.
permissions:
  contents: write

concurrency:
  group: check-stock
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run stock checker
        run: python scripts/check_stock.py

      - name: Commit updated status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status.json
          if git diff --cached --quiet; then
            echo "No change to commit."
          else
            git commit -m "chore: stock check $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
